<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVARC - Conejo Valley Amateur Radio Club</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
        }
        h1 { color: #333; font-size: 2.5em; margin-bottom: 20px; }
        p { color: #666; font-size: 1.1em; margin-bottom: 30px; }
        a { 
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s ease;
        }
        a:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>CVARC</h1>
        <p>Conejo Valley Amateur Radio Club</p>
        <a href="/cvarclogger/">CvarcLogger - Amateur Radio Logging Software</a>
    </div>
</body>
</html>
